  <title id="osHeroTitle">secondbrain-skills — independent Agent Skills for Obsidian vaults</title>
  <desc id="osHeroDesc">An original geometric banner. On the left, a diamond lattice of equal facets sits
    beside the wordmark "secondbrain-skills" and the line "Independent Agent Skills for Obsidian vaults". On the
