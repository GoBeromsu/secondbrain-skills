<text x="90" y="310" font-size="13.5" fill="#d9ccff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">capture · Inbox batch</text>
<text x="80" y="354" font-size="16" fill="#c9c2e6">Tabs, files and chats</text>
<text x="80" y="378" font-size="16" fill="#c9c2e6">arrive as candidates.</text>
<text x="80" y="402" font-size="16" fill="#c9c2e6">Nothing is filed yet.</text>
