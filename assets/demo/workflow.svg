</g>
<text x="282" y="190" text-anchor="end" font-size="13" letter-spacing="2" fill="#a78bfa" font-weight="700">01</text>
<text x="80" y="276" font-size="24" font-weight="750" fill="#f4ead5">Book drop</text>
