<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">From source to shelf</title>
<desc id="d">Four stations: the book drop (capture, with ingest's Inbox batch), the archive (Raw source kept verbatim), the constellation (wiki pages, entities and maps linked into one network) and the reading room (answers that follow the links, with citations), with a shelf-care loop of lint, audit and verify underneath.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1936"/><stop offset="1" stop-color="#141224"/></linearGradient>
<radialGradient id="lamp" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#f0b85a" stop-opacity=".16"/><stop offset="1" stop-color="#f0b85a" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b85a"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
</defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<rect width="1200" height="600" rx="28" fill="url(#lamp)"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<text x="56" y="64" font-size="13" letter-spacing="3.5" fill="#f0b85a" font-weight="600">HOW THE LIBRARY RUNS</text>
<text x="56" y="108" font-size="34" font-weight="800" fill="#f4ead5" letter-spacing="-.5">From source to constellation to answer.</text>
