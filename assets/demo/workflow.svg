<text x="926" y="276" font-size="24" font-weight="750" fill="#f4ead5">Reading room</text>
<rect x="926" y="292" width="61" height="26" rx="13" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="936" y="310" font-size="13.5" fill="#d9ccff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">query</text>
<text x="926" y="354" font-size="16" fill="#c9c2e6">Answers follow the</text>
