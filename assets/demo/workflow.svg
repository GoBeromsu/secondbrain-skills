<text x="846" y="190" text-anchor="end" font-size="13" letter-spacing="2" fill="#a78bfa" font-weight="700">03</text>
<text x="644" y="276" font-size="24" font-weight="750" fill="#f4ead5">Constellation</text>
<rect x="644" y="292" width="176" height="26" rx="13" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="654" y="310" font-size="13.5" fill="#d9ccff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ingest · principles</text>
<text x="644" y="354" font-size="16" fill="#c9c2e6">Pages, Entities and</text>
<text x="644" y="378" font-size="16" fill="#c9c2e6">Maps are linked until</text>
