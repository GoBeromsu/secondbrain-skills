name: Bug report
description: A package did the wrong thing, or failed to trigger when it should have.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [audit, bases, capture, concept, entity, inbox, ingest, lint, obsidian-cli, obsidian-clipper, obsidian-sync, obsidian-visualize, onboard, principle-collective-description, principle-draw-structure, principle-entity-types, principle-frontmatter, principle-hierarchy, principle-link-form, principle-markdown-blocks, principle-not-a-research-log, principle-note-kinds, principle-note-shape, principle-original-order, principle-plain-tldr, principle-preserve-unrequested, principle-preserve-voice, principle-provenance, principle-quotation-attribution, principle-read-back, principle-resolve-target, principle-revise-and-consolidate, principle-standalone-note, principle-vault-roles, query, refresh-context, reindex, secondbrain-mode, status, term, verify, "not sure / several"]
    validations: { required: true }
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Claude Code 2.1.330, Codex 0.x, Hermes …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: secondbrain-skills version
      placeholder: "0.26.0"
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: The prompt, with private vault content removed.
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private notes, names and credentials from this report.
          required: true
