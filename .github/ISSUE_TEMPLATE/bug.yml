name: Bug report
description: A package did the wrong thing, or failed to trigger when it should have.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [audit, bases, capture, inbox, ingest, lint, obsidian-cli, obsidian-clipper, obsidian-sync, obsidian-visualize, onboard, principle-archival, principle-formatting, principle-knowledge-notes, principle-writing, query, refresh-context, reindex, status, verify, "not sure / several"]
    validations: { required: true }
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Claude Code 2.1.330, Codex 0.x, Hermes …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: secondbrain-skills version
      placeholder: "0.26.0"
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: The prompt, with private vault content removed.
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private notes, names and credentials from this report.
          required: true
